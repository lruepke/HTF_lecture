name: website

on: 
  push:
    branches: main

jobs:
  LectureNotePages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.4

      - name: Set up Python 3.9
        uses: actions/setup-python@v2
        with:
          python-version: 3.9

      - name: Install tools
        run: |
          pip install sphinx sphinx_rtd_theme sphinxcontrib-bibtex matplotlib pandas numpy nbconvert ipykernel sphinx_inline_tabs sphinx_copybutton nbsphinx
          sudo apt-get install pandoc
          sudo apt-get install hugo

      - name: Generate main pages and sphinx pages
        run: |
          # 0. Set lectures
          lectures="Winter2020 Summer2021 Summer2022 Winter2022 Winter2023 Summer2024 Summer2025"
          commitIDFile_stored=commit.ID

          # 1. Fetch history
          git fetch origin gh-pages
          git checkout gh-pages
          mkdir ../history

          for lecture in $lectures
          do
            lecture_lc=$(echo "$lecture" | awk '{print tolower($0)}')
            if [ -d "$lecture_lc" ]; then
              cp -rf "$lecture_lc" ../history
            else
              echo "Lecture folder $lecture_lc does not exist on gh-pages, skipping."
            fi
          done

          git checkout main

          # 2. Build the home page
          cd home
          hugo
          cd ..
          cp -rf home/public/ .

          # 3. Build each lecture
          git pull origin --unshallow || true  # avoid error if already full

          for lecture in $lectures
          do
            lectureName_hugo=$(echo "$lecture" | awk '{print tolower($0)}')

            # Try to get last commit ID from stored file
            commitIDFile=../history/${lectureName_hugo}/${commitIDFile_stored}
            if [ -f "${commitIDFile}" ]; then
              lastcommit=$(head -n 1 "${commitIDFile}")
              echo "Last commit ID for ${lecture}: ${lastcommit}"
            else
              echo "No stored commit ID for ${lecture}, will force rebuild"
              lastcommit=""
            fi

            # Check if lastcommit is valid
            build_lecture="no"
            if [[ -n "$lastcommit" ]] && git cat-file -e ${lastcommit}^{commit} 2>/dev/null; then
              echo "Valid commit found. Checking for changes..."
              if git diff --quiet ${lastcommit} -- ${lecture}/; then
              echo "$lecture is not updated."
              if [ -d "../history/${lectureName_hugo}" ]; then
                echo "Copying previous pages from history."
                  mkdir -p public/${lectureName_hugo}
                  cp -rf ../history/${lectureName_hugo}/* public/${lectureName_hugo}
                else
                  echo "No history available for ${lecture}, forcing build!"
                  build_lecture="yes"
                fi
              else
                echo "$lecture has changed since $lastcommit. Rebuilding!"
                build_lecture="yes"
                fi
              else
              echo "Invalid or missing lastcommit for ${lecture}. Rebuilding!"
              build_lecture="yes"
            fi

            # Build if needed
            if [[ "$build_lecture" == "yes" ]]; then
                cd ${lecture}
                make html
                echo $(git log --format="%H" -n 1) > build/html/${commitIDFile_stored}
              mkdir -p ../public/${lectureName_hugo}
                cp -rf build/html/* ../public/${lectureName_hugo}
                cd ..
              fi
          done

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
